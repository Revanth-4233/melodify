services:
  # Next.js Frontend
  - type: web
    name: melodify-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # Spring Boot Backend
  - type: web
    name: melodify-backend
    env: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: melodify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: melodify-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: melodify-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: melodify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: melodify-db
          property: password
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: APP_JWT_SECRET
        generateValue: true

databases:
  # Render PostgreSQL Database
  - name: melodify-db
    databaseName: melodify
    user: melodify_user
    plan: free
