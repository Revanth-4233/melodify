services:
  # Web Service for Java Spring Boot Backend API
  - type: web
    name: melodify-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production

  # Static Site for Vite React Frontend
  - type: web
    name: melodify-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://melodify-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html




