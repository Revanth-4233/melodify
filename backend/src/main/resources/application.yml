server:
  port: 8080

spring:
  application:
    name: music-catalog-insights

  # Database Configuration (Defaults to local MySQL, overridden by Render env vars)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/melodify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  # Cache configuration
  cache:
    type: simple

# JWT Configuration
app:
  jwt:
    secret: MusicPlatformSuperSecretKeyForJWTTokenGeneration2024ThisMustBeLongEnoughForHS512
    expiration-ms: 86400000  # 24 hours

# iTunes API Configuration
itunes:
  api:
    base-url: https://itunes.apple.com

# Logging
logging:
  level:
    com.musicplatform: INFO
    org.springframework.security: INFO
